<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story shell browser checks</title>
<style>body { margin: 0; } iframe { border: 0; display: block; width: 100%; height: 800px; }</style>
<iframe id="app" src="../index.html#city" title="Story shell under test"></iframe>
<pre id="report">RUNNING</pre>
<script type="module">
const frame = document.getElementById("app");
const viewport = Number(new URLSearchParams(location.search).get("viewport"));
if (viewport > 0) frame.style.width = `${viewport}px`;
const checks = [];
function assert(condition, message) {
  if (!condition) throw new Error(message);
  checks.push(message);
}
async function until(test) {
  for (let attempt = 0; attempt < 300; attempt++) {
    if (test()) return;
    // Scroll events and smooth scrolling advance on rendered frames, not the
    // virtual timer clock used by the headless browser runner.
    await new Promise((resolve) => requestAnimationFrame(resolve));
  }
  throw new Error("Timed out waiting for navigation");
}
try {
  await until(() => frame.contentDocument.querySelector('[href="#city"][aria-current="location"]'));
  await until(() => frame.contentDocument.getElementById("outcome-status")?.textContent === "Recommended scenario ready");
  await until(() => frame.contentDocument.getElementById("price-choice-status")?.textContent === "Tested-price comparison ready"
    && frame.contentDocument.getElementById("position-status")?.textContent === "Price positioning ready");
  await until(() => frame.contentDocument.getElementById("segments-status")?.textContent === "Segment evidence ready"
    && frame.contentDocument.getElementById("channels-status")?.textContent === "Channel comparison ready"
    && frame.contentDocument.getElementById("city-status")?.textContent === "City data ready"
    && frame.contentDocument.getElementById("launch-status")?.textContent === "Launch context ready");
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const ids = ["strategy", "segments", "channels", "price", "city", "timing", "outcome"];
  const header = doc.querySelector(".story-header");
  const active = () => doc.querySelector("[data-section-link][aria-current]")?.hash;
  assert([...doc.querySelectorAll("main > section")].map((s) => s.id).join() === ids.join(), "Seven story sections appear in the requested order");
  assert(doc.querySelector("#city #city-form") && doc.querySelector("#timing #launch-controls"), "Existing city and timing controls are relocated inside the story sections");
  const idsOnPage = [...doc.querySelectorAll("[id]")].map((element) => element.id);
  assert(new Set(idsOnPage).size === idsOnPage.length, "Relocation introduces no duplicate IDs");
  assert(doc.getElementById("city").getBoundingClientRect().top >= header.getBoundingClientRect().bottom, "Direct city link clears the sticky navbar");
  assert(win.getComputedStyle(doc.documentElement).scrollBehavior === (win.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"), "Scroll behavior respects the current motion preference");
  assert(doc.documentElement.scrollWidth <= win.innerWidth, "Navbar fits the viewport without horizontal overflow");
  assert(win.performance.getEntriesByType("resource").filter((entry) => entry.name.includes("/data/")).every((entry) => entry.name.includes("/data/app_data/")), "Story loads only prepared application data");
  for (const id of [...ids, ...ids.slice().reverse()]) {
    doc.getElementById(id).scrollIntoView({ behavior: "instant" });
    await until(() => active() === `#${id}`);
    assert(Math.abs(header.getBoundingClientRect().top) < 1, `${id}: navbar remains pinned when scrolling`);
    assert(doc.querySelectorAll("[data-section-link][aria-current]").length === 1, `${id}: exactly one active section`);
  }
  doc.querySelector('[href="#timing"]').click();
  await until(() => active() === "#timing" && win.location.hash === "#timing");
  assert(doc.getElementById("timing").getBoundingClientRect().top >= header.getBoundingClientRect().bottom, "Anchor click reaches the section below the navbar");
  doc.querySelector('a[href="simulator.html"]').click();
  await until(() => frame.contentDocument.getElementById("simulator-status")?.textContent === "Simulator ready");
  assert(!frame.contentDocument.getElementById("simulator").hidden, "Separate simulator destination opens working ROI scenarios by default");
  await until(() => frame.contentDocument.getElementById("position-status")?.textContent === "Price positioning ready");
  assert(!frame.contentDocument.getElementById("city-form") && !frame.contentDocument.getElementById("launch-controls"), "Simulator contains no duplicate city or timing screen");
  frame.contentDocument.querySelector('nav a[href="index.html"]').click();
  await until(() => frame.contentDocument.readyState === "complete"
    && frame.contentDocument.querySelector('[href="#strategy"][aria-current="location"]'));
  assert(frame.contentWindow.location.pathname.endsWith("/index.html"), "Story link returns to the shell");
  frame.src = "../simulator.html#cities";
  await until(() => frame.contentWindow.location.pathname.endsWith("/index.html") && frame.contentWindow.location.hash === "#city");
  assert(true, "Legacy simulator city URL redirects to the relocated screen");
  document.getElementById("report").textContent = `PASS: ${checks.length} checks\n${checks.join("\n")}`;
} catch (error) {
  document.getElementById("report").textContent = `FAIL: ${error.message}\n${checks.join("\n")}`;
}
await fetch("/__browser_report", { method: "POST", body: document.getElementById("report").textContent });
</script>
