<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City prioritisation browser checks</title>
<style>body { margin: 0; } iframe { border: 0; width: 100%; height: 2000px; }</style>
<iframe id="app" src="../simulator.html#cities" title="City prioritisation under test"></iframe>
<pre id="report">RUNNING</pre>
<script type="module">
import { rankCities, reliabilityLabel } from "../city-engine.js";
const checks = [];
const frame = document.getElementById("app");
const viewport = Number(new URLSearchParams(location.search).get("viewport"));
if (viewport > 0) frame.style.width = `${viewport}px`;
const report = document.getElementById("report");
const assert = (condition, message) => {
  if (!condition) throw new Error(message);
  checks.push(message);
};
const throws = (fn) => { try { fn(); return false; } catch { return true; } };
async function until(test) {
  for (let attempt = 0; attempt < 300; attempt++) {
    if (test()) return;
    await new Promise((resolve) => setTimeout(resolve, 20));
  }
  throw new Error("Timed out waiting for city UI");
}
try {
  const data = await (await fetch("../data/app_data/city_prioritisation.json")).json();
  const baseline = rankCities(data.cities);
  assert(baseline.map((row) => row.city).join(",") === "Berlin,Munich,Cologne,Hamburg,Frankfurt", "Equal weights give independently expected city order");
  assert(Math.abs(baseline[0].score - 95.59228650137741) < 1e-8, "Berlin index matches hand-calculated min-max result");
  assert(rankCities(data.cities, [100, 0, 0]).map((row) => row.city).join(",") === "Berlin,Munich,Hamburg,Cologne,Frankfurt", "Market size alone orders all five regional market values");
  const growth = rankCities(data.cities, [0, 100, 0]);
  assert(growth[0].rank === 1 && growth[1].rank === 1 && growth[2].rank === 3 && growth[4].rank === 3, "Growth ties share ranks without false precision");
  const wellness = rankCities(data.cities, [0, 0, 100]);
  assert(wellness.map((row) => row.city).join(",") === "Cologne,Berlin,Hamburg,Munich,Frankfurt", "Wellness-only ranking uses city-level composition");
  assert(!baseline.some((row) => row.city === "Other Germany"), "Other Germany cannot distort city normalisation");
  assert(throws(() => rankCities(data.cities, [0, 0, 0])) && throws(() => rankCities(data.cities, [NaN, 1, 1])) && throws(() => rankCities(data.cities, [-1, 1, 1])), "Zero, non-finite and negative weights are rejected");
  assert(throws(() => rankCities(data.cities.map((row) => ({ ...row, respondentCount: 14 })))), "Small city total prevents unsupported ranking");
  assert(throws(() => rankCities(data.cities.map((row) => ({ ...row, growth: null })))), "Missing regional value fails explicitly");
  assert(rankCities(data.cities.map((row) => ({ ...row, growth: .07 })), [0, 1, 0]).every((row) => row.score === 50 && row.rank === 1), "Constant criterion produces neutral scores and ties");
  assert(reliabilityLabel(15) === "Reliable" && reliabilityLabel(14).startsWith("Directional") && reliabilityLabel(8).startsWith("Directional") && reliabilityLabel(7) === "Insufficient", "Reliability boundaries follow agreed n=15 and n=8 rule");
  data.segmentDiagnostics.forEach((row) => { row.purchaseIntent = 10000; });
  assert(JSON.stringify(rankCities(data.cities)) === JSON.stringify(baseline), "Changing segment diagnostics cannot change scores");

  await until(() => frame.contentDocument.getElementById("city-status")?.textContent === "City data ready");
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const get = (id) => doc.getElementById(id);
  const order = () => [...doc.querySelectorAll("#city-ranking-body tr")].map((row) => row.dataset.city);
  function setWeights(values) {
    ["marketSizeEur", "growth", "wellnessDensity"].forEach((key, index) => { get(`weight-${key}`).value = values[index]; });
    get("city-form").dispatchEvent(new win.Event("input", { bubbles: true }));
  }
  assert(!get("cities").hidden && get("city-results").hidden === false && order().length === 5, "Cities hash opens fully loaded ranking");
  setWeights([0, 0, 100]);
  assert(order()[0] === "Cologne" && get("city-ranking-summary").textContent.includes("Cologne ranks first"), "Sliders visibly change leader to Cologne");
  assert(doc.querySelector('#city-ranking-body tr[data-city="Cologne"] .rank-change').textContent === "↑ 2", "Rank movement is measured against equal weights");
  assert(get("share-wellnessDensity").textContent === "100%", "Displayed weights normalise to selected importance");
  setWeights([0, 100, 0]);
  assert(get("city-ranking-summary").textContent.includes("Berlin and Munich tie"), "UI announces shared growth lead");
  setWeights([0, 0, 0]);
  assert(!get("city-error").hidden && get("city-results").hidden && order().length === 0, "All-zero weights hide stale rankings with actionable error");
  get("city-reset-weights").click();
  assert(get("city-error").hidden && !get("city-results").hidden && order()[0] === "Berlin", "Equal-weight reset recovers results");
  get("city-diagnostic-select").value = "Frankfurt";
  get("city-diagnostic-select").dispatchEvent(new win.Event("change"));
  const cards = [...doc.querySelectorAll(".segment-card")];
  assert(cards.length === 4 && cards.every((card) => card.querySelector(".reliability").textContent.includes("n=")), "Every segment carries sample count and reliability");
  assert(cards.filter((card) => card.textContent.includes("Insufficient")).every((card) => !card.textContent.includes("Purchase intent:")), "Insufficient segment intent is withheld");
  assert(get("city-survey-summary").textContent.includes("n=32") && get("city-survey-summary").textContent.includes("6 of 32"), "Wellness proxy uses all city respondents as denominator");
  win.location.hash = "#simulator";
  await until(() => !get("simulator").hidden);
  win.location.hash = "#cities";
  await until(() => !get("cities").hidden);
  assert(get("city-diagnostic-select").value === "Frankfurt", "Diagnostics selection survives navigation");
  assert(doc.documentElement.scrollWidth <= win.innerWidth, "Layout does not overflow viewport; table scroll is contained");
  if (viewport) assert(win.innerWidth === viewport, "Requested mobile viewport width is actually applied");

  const originalFetch = win.fetch;
  win.fetch = async () => new win.Response("", { status: 503 });
  const ui = await win.eval('import("/city-ui.js")');
  await ui.initialiseCities();
  assert(get("city-controls").disabled && get("city-results").hidden && !get("retry-cities").hidden, "Loading failure disables controls and hides results");
  win.fetch = originalFetch;
  get("retry-cities").click();
  await until(() => get("city-status").textContent === "City data ready");
  assert(!get("city-controls").disabled && !get("city-results").hidden, "Retry recovers city screen");
  report.textContent = `PASS: ${checks.length} browser checks\n${checks.join("\n")}`;
} catch (error) {
  report.textContent = `FAIL: ${error.stack}\nPassed: ${checks.join("\n")}`;
}
</script>
</html>
